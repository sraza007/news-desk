name: Update news and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Fetch headlines
        env:
          # last published copy, used to fill in any feed that fails this run
          PREVIOUS_NEWS_URL: ${{ steps.pages.outputs.base_url }}/data/news.json
        run: npm run fetch

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css app.js feeds.json data _site/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
