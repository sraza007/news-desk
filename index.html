<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Desk</title>
  <meta name="description" content="Canadian, world and Pakistani headlines plus NA sports, cricket and tennis in one place.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2320183E'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23E02F10'/%3E%3Crect x='7' y='15' width='18' height='2' rx='1' fill='%23EFEBE6'/%3E%3Crect x='7' y='20' width='12' height='2' rx='1' fill='%23EFEBE6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-row">
      <div>
        <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>News Desk</h1>
        <p class="today" id="today"></p>
      </div>
    </div>
    <nav class="wrap tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div>
        <h2 class="section-title" id="section-title"></h2>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh headlines">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        <span>Refresh</span>
      </button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter stories"></div>
    <div class="grid" id="stories"></div>
  </main>

  <footer class="wrap footer">
    Headlines come from each publisher's public RSS feed and open on their site.
    Updates automatically each morning by about 5:30 AM Alberta time; Refresh pulls the latest whenever you want.
  </footer>

  <script src="app.js"></script>
</body>
</html>
